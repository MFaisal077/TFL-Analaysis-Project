name: Hourly TfL Data Fetcher

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at the top of every hour
  workflow_dispatch:      # Allows you to trigger it manually from GitHub anytime

jobs:
  fetch-tfl-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run TfL API script
        run: python src/api_test.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_status.json
          git commit -m "Automated hourly update: TfL live status" || exit 0
          git push